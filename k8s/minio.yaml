# 1. Le disque : une demande de 1 Go de stockage persistant
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: deployops-system
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: deployops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# 2. Le serveur MinIO
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: deployops-system
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: deployops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: deployops
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: minio-credentials
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
# 3. L'adresse stable de MinIO dans le cluster
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: deployops-system
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: deployops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console